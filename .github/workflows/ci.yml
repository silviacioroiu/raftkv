name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # -p 1 runs one package at a time. Several tests depend on heartbeats
      # arriving within an election timeout, and the race detector slows
      # everything down enough that packages competing for CPU could starve them.
      - name: Test with the race detector
        run: go test -race -count=1 -p 1 -timeout 15m ./...
